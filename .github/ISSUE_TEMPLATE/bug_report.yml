name: Bug report
description: Report a reproducible problem in the bot
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include Discord tokens, API keys, cookies, `.env` contents, or private user data.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Music / voice playback
        - Werewolf game
        - AI chat
        - Deployment / Docker / Railway
        - Commands / UI
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Use command ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.x"
  - type: input
    id: environment
    attributes:
      label: Hosting environment
      placeholder: "Windows / Docker / Railway / other"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, cookies, IDs, and private data before pasting logs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
